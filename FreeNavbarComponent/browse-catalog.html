<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidewater · Browse catalog</title>

<!-- Bootstrap 5.3.3, CDN. No project stylesheet: every class below is Bootstrap's. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-body-tertiary">

<!--
  Nested catalog menu, five levels deep.

  Bootstrap has no multi-level dropdown, so the submenus are nested
  .accordion blocks inside one ordinary .dropdown-menu. Bootstrap's collapse
  data API opens each branch, writes aria-expanded back to the button and
  rotates the chevron, so the menu itself needs no JavaScript at all.

  Two attributes carry the whole design:
    data-bs-auto-close="outside"  keeps the panel open while you drill in
    data-bs-theme="light"         stops the navbar dark scheme cascading in

  The menu itself needs no JavaScript; the only script in this file filters the
  tree for the search box. There is no CSS beyond bootstrap.min.css. The single inline style is the brand colour
  on the navbar, because Bootstrap has no crimson background utility.
-->
<nav class="navbar navbar-expand sticky-top shadow-sm" data-bs-theme="dark" style="background: #a60f2d">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">Tidewater</a>

    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Overview</a></li>

      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle" href="#" role="button"
           data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">Browse catalog</a>

        <div class="dropdown-menu p-0 shadow overflow-auto" data-bs-theme="light">
          <h6 class="dropdown-header">Product catalog</h6>

          <div class="p-2 border-bottom">
            <label class="visually-hidden" for="cat-search">Search the catalog</label>
            <input type="search" class="form-control form-control-sm" id="cat-search"
                   placeholder="Search the catalog" aria-controls="cat-acc" autocomplete="off">
          </div>

          <div class="accordion accordion-flush" id="cat-acc">

            <!-- LEVEL 1 -->
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed py-2" type="button"
                        data-bs-toggle="collapse" data-bs-target="#c-obs"
                        aria-expanded="false" aria-controls="c-obs">Observations</button>
              </h2>
              <div class="accordion-collapse collapse" id="c-obs">
                <div class="accordion-body p-0 ps-3">

                  <!-- LEVEL 2 -->
                  <div class="accordion accordion-flush">
                    <div class="accordion-item">
                      <h3 class="accordion-header">
                        <button class="accordion-button collapsed py-2" type="button"
                                data-bs-toggle="collapse" data-bs-target="#c-surf"
                                aria-expanded="false" aria-controls="c-surf">Surface</button>
                      </h3>
                      <div class="accordion-collapse collapse" id="c-surf">
                        <div class="accordion-body p-0 ps-3">

                          <!-- LEVEL 3 -->
                          <div class="accordion accordion-flush">
                            <div class="accordion-item">
                              <h4 class="accordion-header">
                                <button class="accordion-button collapsed py-2" type="button"
                                        data-bs-toggle="collapse" data-bs-target="#c-land"
                                        aria-expanded="false" aria-controls="c-land">Land stations</button>
                              </h4>
                              <div class="accordion-collapse collapse" id="c-land">
                                <div class="accordion-body p-0 ps-3">

                                  <!-- LEVEL 4 -->
                                  <div class="accordion accordion-flush">
                                    <div class="accordion-item">
                                      <h5 class="accordion-header">
                                        <button class="accordion-button collapsed py-2" type="button"
                                                data-bs-toggle="collapse" data-bs-target="#c-metar"
                                                aria-expanded="false" aria-controls="c-metar">METAR</button>
                                      </h5>
                                      <div class="accordion-collapse collapse" id="c-metar">
                                        <div class="accordion-body p-0 ps-3">

                                          <!-- LEVEL 5: leaves are plain dropdown items -->
                                          <a class="dropdown-item" href="#">12Z cycle</a>
                                          <a class="dropdown-item" href="#">18Z cycle</a>

                                        </div>
                                      </div>
                                    </div>
                                  </div>

                                  <a class="dropdown-item" href="#">Mesonet</a>
                                </div>
                              </div>
                            </div>
                          </div>

                          <a class="dropdown-item" href="#">Marine buoys</a>
                        </div>
                      </div>
                    </div>
                  </div>

                  <a class="dropdown-item" href="#">Upper air</a>
                </div>
              </div>
            </div>

            <!-- No divider between items: .accordion-flush already draws the
                 border between siblings, so an hr here reads as a double rule. -->
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed py-2" type="button"
                        data-bs-toggle="collapse" data-bs-target="#c-water"
                        aria-expanded="false" aria-controls="c-water">Water</button>
              </h2>
              <div class="accordion-collapse collapse" id="c-water">
                <div class="accordion-body p-0 ps-3">
                  <a class="dropdown-item" href="#">Tide predictions</a>
                  <a class="dropdown-item" href="#">Stream gauges</a>
                </div>
              </div>
            </div>
          </div>

          <hr class="dropdown-divider">
          <span class="dropdown-item-text small text-secondary" role="status" aria-live="polite" id="cat-count">42 products across 5 levels</span>
        </div>
      </li>

      <li class="nav-item"><a class="nav-link disabled" aria-disabled="true" href="#">Alerts</a></li>
    </ul>
  </div>
</nav>

<main class="container py-5">
  <h1 class="h2">Seattle&ndash;Tacoma, WA</h1>
  <p class="lead text-secondary">72&deg;F, mostly clear &middot; station KSEA</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // The ONLY script in this file, and the menu does not depend on it: every
  // branch is opened by Bootstrap's collapse data API. This filters the tree.
  //
  // It adds no CSS either — visibility is Bootstrap's own .d-none utility.
  (function () {
    var box = document.getElementById("cat-search");
    var tree = document.getElementById("cat-acc");
    var count = document.getElementById("cat-count");
    var slice = function (nodes) { return Array.prototype.slice.call(nodes); };

    box.addEventListener("input", function () {
      var q = box.value.trim().toLowerCase();
      var items = slice(tree.querySelectorAll(".accordion-item"));
      var leaves = slice(tree.querySelectorAll(".dropdown-item"));

      if (!q) {                                  // empty query: whole tree, all closed
        slice(tree.querySelectorAll(".d-none")).forEach(function (el) {
          el.classList.remove("d-none");
        });
        items.forEach(function (item) {
          item.querySelector(".accordion-collapse").classList.remove("show");
          var btn = item.querySelector(".accordion-button");
          btn.classList.add("collapsed");
          btn.setAttribute("aria-expanded", "false");
        });
        count.textContent = leaves.length + " products across 5 levels";
        return;
      }

      // 1. a leaf survives on its own label
      leaves.forEach(function (leaf) {
        leaf.classList.toggle("d-none", leaf.textContent.toLowerCase().indexOf(q) < 0);
      });

      // 2. a branch whose own label matches reveals its whole subtree
      items.forEach(function (item) {
        var label = item.querySelector(".accordion-button").textContent.toLowerCase();
        item.hasOwnHit = label.indexOf(q) > -1;
        if (item.hasOwnHit) {
          slice(item.querySelectorAll(".d-none")).forEach(function (el) {
            el.classList.remove("d-none");
          });
        }
      });

      // 3. innermost branch first, so a deep hit keeps its ancestors alive
      items.slice().reverse().forEach(function (item) {
        var keep = item.hasOwnHit
          || item.querySelector(".dropdown-item:not(.d-none)")
          || item.querySelector(".accordion-item:not(.d-none)");
        item.classList.toggle("d-none", !keep);

        var btn = item.querySelector(".accordion-button");
        item.querySelector(".accordion-collapse").classList.add("show");
        btn.classList.remove("collapsed");
        btn.setAttribute("aria-expanded", "true");
      });

      var shown = tree.querySelectorAll(".dropdown-item:not(.d-none)").length;
      count.textContent = shown === 1 ? "1 product matches" : shown + " products match";
    });
  })();
</script>

</body>
</html>
